name: CI Verify
description: >-
  Lint, format-check and unit-test the pipecat-ojin package (src + tests). No build,
  no publish. Shared by pr-check.yml and release.yml so the PR gate and the release
  verify gate run identical checks and can never drift. A composite action (not a
  reusable workflow) so callers keep flat job names on the PR (e.g. "PR Check / verify"
  rather than "PR Check / verify / verify").

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
    - run: uv sync --all-extras
      shell: bash
    # Scope to the shipped package: examples/ are standalone runnable agents with their
    # own requirements.txt and aren't part of the pipecat-ojin wheel, so their lint/
    # format debt must not block a PR or a library release.
    - run: uv run ruff format --check src tests
      shell: bash
    - run: uv run ruff check src tests
      shell: bash
    - run: uv run pytest tests # hermetic unit suite; uses fakes/mocks, no network
      shell: bash
    # Advisory only: pipecat-ojin doesn't enforce static typing in CI, so type issues
    # are surfaced but never block. Composite steps don't support continue-on-error, so
    # `|| true` keeps it non-blocking.
    - name: Type-check (advisory, non-blocking)
      shell: bash
      run: |
        source .venv/bin/activate
        uvx pyright || true
